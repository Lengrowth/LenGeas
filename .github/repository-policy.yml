schema_version: "1.0.0"
export_type: local_repository_policy_intent
repository:
  remote_configured: true
  live_github_state: partially_observed
  checked_commands:
    - command: git remote -v
      result: "origin https://github.com/guerra2fernando/LenGeas.git"
    - command: git remote get-url origin
      exit_code: 0
      result: "https://github.com/guerra2fernando/LenGeas.git"
  blocker: The private GitHub repository and owner are confirmed, but the active integration cannot read live branch protection and the push verification run ended in startup_failure; this file remains a local policy export.
ownership:
  model: sole_developer_repository_owner
  github_owner_binding: guerra2fernando
  second_approver_required: false
  note: Role IDs remain governance lenses held by the same repository owner; no team is invented.
branch_protection:
  target: main
  required:
    - pull_request_before_merge
    - required_status_checks
    - code_owner_review_when_bound
    - linear_history
    - signed_commits
    - no_force_push
    - no_deletion
  pull_request:
    required_approvals: 1
    dismiss_stale_reviews: true
    require_last_push_approval: true
    allow_bypass: false
  merge:
    allowed_methods: [squash]
    allow_merge_commit: false
    allow_rebase_merge: false
  status_checks:
    strict: true
    required_contexts:
      - verify / verify
      - dependency-review / dependency-review
      - codeql / analyze
  tag_policy:
    release_pattern: "v*"
    require_annotated_tag: true
    require_signed_tag: true
    require_verified_release_artifact: true
automation:
  dependabot_config: .github/dependabot.yml
  pull_request_template: .github/PULL_REQUEST_TEMPLATE.md
documentation:
  signed_release_tags: .github/policies/signed-release-tags.md
  ci_evidence_links: .github/policies/ci-evidence-links.md
verification:
  local_export_validated: true
  live_branch_protection_validated: false
  observed_branch_protection_enabled: false
  live_ci_validated: false
  live_ci_observation: "run 34752755231 for audited commit 22f3698a6af4247f7c3054a214204fd07e3d4c2a: startup_failure; no jobs"
