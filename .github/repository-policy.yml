schema_version: "1.0.0"
export_type: local_repository_policy_intent
repository:
  remote_configured: true
  live_github_state: validated
  checked_commands:
    - command: git remote -v
      result: "origin https://github.com/Lengrowth/LenGeas.git"
    - command: git remote get-url origin
      exit_code: 0
      result: "https://github.com/Lengrowth/LenGeas.git"
  blocker: none
ownership:
  model: sole_developer_repository_owner
  github_owner_binding: Lengrowth
  second_approver_required: false
  note: Role IDs remain governance lenses held by the same repository owner; no team is invented.
branch_protection:
  target: main
  required:
    - required_status_checks
    - linear_history
    - no_force_push
    - no_deletion
  pull_request:
    required_approvals: 0
    dismiss_stale_reviews: false
    require_last_push_approval: false
    allow_bypass: false
  merge:
    allowed_methods: [squash]
    allow_merge_commit: false
    allow_rebase_merge: false
  status_checks:
    strict: true
    required_contexts:
      - verify
      - dependency-review
      - analyze (python)
      - analyze (javascript-typescript)
  tag_policy:
    release_pattern: "v*"
    require_annotated_tag: true
    require_signed_tag: false
    require_verified_release_artifact: true
automation:
  dependabot_config: .github/dependabot.yml
  pull_request_template: .github/PULL_REQUEST_TEMPLATE.md
documentation:
  signed_release_tags: .github/policies/signed-release-tags.md
  ci_evidence_links: .github/policies/ci-evidence-links.md
verification:
  local_export_validated: true
  live_branch_protection_validated: true
  observed_branch_protection_enabled: true
  live_ci_validated: true
  live_ci_observation: "PR 14 verify run 34759754929 passed; release run 34760098397 passed"
  observed_commit_signature: "447cabf916ae0877c1c8cd91df92fbee2caac446: unsigned; commit signatures are not required"
  screenshot_available: false
