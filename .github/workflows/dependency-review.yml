name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/dependency-review-action@v4.7.3
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0,AGPL-3.0

