name: verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.15.8
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          version: 0.11.29
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.16.0
          cache: pnpm
      - uses: go-task/setup-task@v2.2.0
        with:
          version: 3.53.1
      - run: task bootstrap
      - run: task generate
      - name: Start dependency stack
        run: task local:up
      - name: Start identity E2E API boundary
        shell: bash
        run: |
          uv run --frozen uvicorn apps.api.app.e2e:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/identity-e2e.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/identity-e2e.pid"
          E2E_DEVICE_KEY=$(uv run --frozen python -c 'import base64; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; print(base64.urlsafe_b64encode(Ed25519PrivateKey.generate().public_key().public_bytes_raw()).rstrip(b"=").decode())')
          E2E_LIFECYCLE_DEVICE_KEY=$(uv run --frozen python -c 'import base64; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; print(base64.urlsafe_b64encode(Ed25519PrivateKey.generate().public_key().public_bytes_raw()).rstrip(b"=").decode())')
          {
            echo "LENGEAS_E2E_BASE_URL=http://127.0.0.1:8001"
            echo "LENGEAS_E2E_GUEST_PROOF=ci-e2e-proof"
            echo "LENGEAS_E2E_LIFECYCLE_PROOF=ci-e2e-lifecycle-proof"
            echo "LENGEAS_E2E_DEVICE_PUBLIC_KEY=$E2E_DEVICE_KEY"
            echo "LENGEAS_E2E_LIFECYCLE_DEVICE_PUBLIC_KEY=$E2E_LIFECYCLE_DEVICE_KEY"
            echo "LENGEAS_E2E_TOKEN=ci-e2e-token"
          } >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/identity-e2e.log"
          exit 1
      - run: task verify
      - run: task format
      - run: task lint
      - run: task typecheck
      - run: task test:unit
      - run: task test:property
      - run: task test:contract
      - run: task test:integration
      - run: task test:e2e
      - run: task test:security
      - run: task test:performance
      - run: task test:determinism
      - run: task test:dr
        # The task is the mandatory disaster-recovery suite.
      - run: uv run --frozen python tools/dev/ci_checks.py workflow-policy
      - run: uv run --frozen python tools/dev/ci_checks.py terraform-policy
      - run: uv run --frozen python tools/dev/ci_checks.py docs-links
      - run: uv run --frozen python tools/dev/ci_checks.py schema
      - run: uv run --frozen python tools/dev/ci_checks.py openapi
      - run: uv run --frozen python tools/dev/ci_checks.py license-policy
      - name: Verify Phase 02 evidence and policies
        run: |
          task evidence PHASE=02
          uv run --frozen python tools/dev/phase02_checks.py negative
          uv run --frozen python tools/dev/ci_checks.py phase02-policy
      - name: Validate Phase 02 Terraform roots
        shell: bash
        run: |
          terraform fmt -check -recursive infrastructure/terraform
          for root in nonproduction staging production dr; do
            terraform -chdir="infrastructure/terraform/environments/${root}" init -backend=false -input=false
            terraform -chdir="infrastructure/terraform/environments/${root}" validate
          done
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: phase-02-evidence-${{ github.sha }}
          path: docs/evidence/phase-02/
          if-no-files-found: error
      - name: Verify Phase 03 evidence and gate
        env:
          LENGEAS_EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run --frozen python tools/dev/evidence.py 03 --regenerate
          task evidence PHASE=03
          task phase:gate PHASE=03
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: phase-03-evidence-${{ github.sha }}
          path: docs/evidence/phase-03/
          if-no-files-found: error
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          version: v0.74.0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks_checksums.txt" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks_checksums.txt | sha256sum --check
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          ./gitleaks version
      - name: Scan repository for secrets
        run: "$RUNNER_TEMP/gitleaks detect --source . --no-banner --redact"
      - uses: anchore/sbom-action@v0.20.9
        with:
          path: .
          artifact-name: sbom-${{ github.sha }}.spdx.json
          output-file: sbom-${{ github.sha }}.spdx.json
      - name: Stop dependency stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/identity-e2e.pid" ]; then
            if kill "$(cat "$RUNNER_TEMP/identity-e2e.pid")" 2>/dev/null; then :; fi
          fi
          task local:down
