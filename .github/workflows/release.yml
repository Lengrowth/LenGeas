name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3.9.0
      - name: Normalize image name
        run: echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - run: docker buildx build --platform linux/arm64 --provenance=true --sbom=true --tag "$IMAGE_REPOSITORY:${{ github.ref_name }}" --push -f infrastructure/docker/api-shell/Dockerfile infrastructure/docker/api-shell
      - run: cosign sign --yes "$IMAGE_REPOSITORY:${{ github.ref_name }}"
      - run: cosign verify "$IMAGE_REPOSITORY:${{ github.ref_name }}" --certificate-identity-regexp='https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}' --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
      - run: python tools/dev/release_manifest.py --tag "${{ github.ref_name }}" --output "release-manifest-${{ github.sha }}.json"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest-${{ github.sha }}.json
          if-no-files-found: error
