global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: platform-api
    static_configs:
      - targets: [api-shell:8000]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
