mandatory_controls:
  - id: MC-001
    statement: Backend is authoritative for authenticated online state, economy value, inventory, entitlements, published definitions, competitive results, and cross-game rewards.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: architecture_owner
    phase_task: P00-T02
    verification_method: authorization, ledger, and replay suites
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-002
    statement: Clients send intent and never authoritative resulting balances, rewards, damage, entitlements, ratings, or match outcomes.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: game_systems_owner
    phase_task: P00-T02
    verification_method: forged-result negative tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-003
    statement: Published definitions are immutable and content-addressed; corrections create a new version.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: game_systems_owner
    phase_task: P00-T02
    verification_method: publish immutability and digest tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-004
    statement: Every state mutation runs through a named action and produces an auditable mutation record.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: runtime_owner
    phase_task: P00-T02
    verification_method: action receipt and audit tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-005
    statement: Every value transfer runs in one economy transaction with balanced ledger entries and an idempotency key.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: data_owner
    phase_task: P00-T02
    verification_method: ledger reconciliation and duplicate tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-006
    statement: Runtime execution is deterministic for the declared execution tuple.
    source_anchor: docs/01-principles-and-invariants.md#determinism-contract
    owner_role: runtime_owner
    phase_task: P00-T02
    verification_method: cross-platform replay suite
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-007
    statement: Runtime logic receives logical UTC time and does not read wall-clock time directly.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: runtime_owner
    phase_task: P00-T02
    verification_method: clock isolation tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-008
    statement: Runtime logic uses only seeded random sources.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: runtime_owner
    phase_task: P00-T02
    verification_method: seed and unseeded-random-source scans
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-009
    statement: Formulas and conditions use the bounded LenGeas expression AST; arbitrary code and eval are forbidden.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: security_owner
    phase_task: P00-T02
    verification_method: formula resource-exhaustion and code-boundary tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-010
    statement: Authoritative state and money math uses integers or fixed-precision decimals; IEEE-754 floating point is forbidden.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: data_owner
    phase_task: P00-T02
    verification_method: numeric conformance tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-011
    statement: Persisted documents carry studio_id and appropriate game_id; authorization filters both before access.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: identity_owner
    phase_task: P00-T02
    verification_method: tenant-escape suite
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-012
    statement: Cross-game access requires a published contract naming source, target, data, purpose, and reward mapping.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: identity_owner
    phase_task: P00-T02
    verification_method: cross-game contract tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-013
    statement: Modules read and write only manifest-declared state namespaces.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: game_systems_owner
    phase_task: P00-T02
    verification_method: module isolation tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-014
    statement: Domain events are past-tense facts; consumers do not mutate another domain collection directly.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: platform_operations_owner
    phase_task: P00-T02
    verification_method: event and repository boundary tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-015
    statement: External delivery is at least once and consumers are idempotent.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: platform_operations_owner
    phase_task: P00-T02
    verification_method: duplicate delivery tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-016
    statement: API, event, save, definition, and package versions evolve independently under compatibility rules.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: architecture_owner
    phase_task: P00-T02
    verification_method: compatibility matrix and migration tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-017
    statement: Humans and AI agents use the same public Definition API and validation/publishing pipeline.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: studio_owner
    phase_task: P00-T02
    verification_method: identical API audit
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-018
    statement: AI output begins as a draft and cannot approve its own publication.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: ai_control_plane_owner
    phase_task: P00-T02
    verification_method: self-approval and tool-scope tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-019
    statement: PII is stored outside game state and never emitted in analytics payloads.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: security_owner
    phase_task: P00-T02
    verification_method: privacy and analytics redaction tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-020
    statement: Logs, traces, metrics, and audit records contain no credentials or raw authentication tokens.
    source_anchor: docs/01-principles-and-invariants.md#platform-invariants
    owner_role: sre_owner
    phase_task: P00-T02
    verification_method: secret scanning and telemetry tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-021
    statement: Canonical JSON uses UTF-8, lexicographically sorted object keys, normalized decimals, UTC Z timestamps, and SHA-256 digests.
    source_anchor: docs/01-principles-and-invariants.md#determinism-contract
    owner_role: runtime_owner
    phase_task: P00-T02
    verification_method: canonical serialization vectors
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-022
    statement: Module manifests declare dependencies, conflicts, schemas, namespaces, registrations, permissions, and budgets; dependency cycles fail and initialization order is deterministic.
    source_anchor: docs/01-principles-and-invariants.md#module-isolation-contract
    owner_role: game_systems_owner
    phase_task: P00-T02
    verification_method: manifest validation and topological-order tests
    evidence_path: docs/evidence/phase-00/tasks/P00-T02.md
  - id: MC-023
    statement: Every mandatory requirement has a stable requirement ID, phase task, and verification gate in traceability.
    source_anchor: docs/01-principles-and-invariants.md#documentation-invariant
    owner_role: architecture_owner
    phase_task: P00-T06
    verification_method: bidirectional traceability audit
    evidence_path: docs/evidence/phase-00/tasks/P00-T06.md
  - id: MC-024
    statement: Phase 00 exits only when all task evidence is reviewable, no unresolved decision marker remains, the traceability audit has no orphan requirements, and Architecture records PASS.
    source_anchor: docs/phases/00-charter-and-architecture-lock.md#exit-gate
    owner_role: platform_technical_lead
    phase_task: P00-T08
    verification_method: phase review checklist and explicit repository-owner decision
    evidence_path: docs/evidence/phase-00/tasks/P00-T08.md
review:
  owners_assigned_by_role: true
  owner_approval: accepted by sole developer / repository owner
  orphan_requirements: none identified in baseline matrix
