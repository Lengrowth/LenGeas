version: '3'

vars:
  PYTHON: '{{.PYTHON | default "python"}}'
  RUNNER: tools/dev/task_runner.py

tasks:
  default:
    cmds:
      - task --list
  bootstrap:
    desc: Install and verify pinned local toolchains and dependencies
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} bootstrap'
  generate:
    desc: Generate canonical contracts and typed artifacts
    cmds:
      - 'uv run --frozen {{.PYTHON}} {{.RUNNER}} generate'
  format:
    desc: Apply deterministic formatters
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} format'
  lint:
    desc: Run repository lint and policy checks
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} lint'
  typecheck:
    desc: Run strict Python and TypeScript checks
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} typecheck'
  test:unit:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} test unit {{.CLI_ARGS}}'
  test:property:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} test property {{.CLI_ARGS}}'
  test:contract:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} test contract {{.CLI_ARGS}}'
  test:integration:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} test integration {{.CLI_ARGS}}'
  test:e2e:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} test e2e {{.CLI_ARGS}}'
  test:security:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} test security {{.CLI_ARGS}}'
  test:performance:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} test performance'
  test:determinism:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} test determinism'
  test:dr:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} test disaster-recovery'
  verify:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} verify'
  evidence:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} evidence {{.PHASE | default "01"}}'
  phase:gate:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} phase-gate {{.PHASE | default "01"}}'
  definition:schemas:
    desc: Compile all Definition Schema v0.1 JSON Schemas
    cmds:
      - 'uv run --frozen python tools/dev/definition_cli.py schemas'
  definition:fixtures:
    desc: Validate all valid and invalid Definition Schema fixtures
    cmds:
      - 'uv run --frozen python tools/dev/definition_cli.py fixtures'
  definition:tests:
    desc: Run Definition Schema unit and security tests
    cmds:
      - 'uv run --frozen python tools/dev/definition_cli.py tests'
  definition:compatibility:
    desc: Check the schema compatibility policy and required v0.1 catalog
    cmds:
      - 'uv run --frozen python tools/dev/definition_cli.py compatibility'
  definition:determinism:
    desc: Verify canonical bundle bytes and SHA-256 reproducibility
    cmds:
      - 'uv run --frozen python tools/dev/definition_cli.py determinism'
  definition:validate:
    desc: Validate a definition bundle YAML document
    cmds:
      - 'uv run --frozen python tools/dev/definition_cli.py validate {{.CLI_ARGS}}'
  definition:canonicalize:
    desc: Resolve and canonicalize a definition YAML package
    cmds:
      - 'uv run --frozen python tools/dev/definition_cli.py canonicalize-package {{.CLI_ARGS}}'
  definition:sign-release:
    desc: Create the detached Ed25519 signature for the local schema release
    cmds:
      - 'uv run --frozen python tools/dev/sign_definition_release.py sign'
  definition:verify-release:
    desc: Verify the detached schema release signature and current digests
    cmds:
      - 'uv run --frozen python tools/dev/sign_definition_release.py verify'
  local:up:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} local-up'
  local:smoke:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} local-smoke'
  local:down:
    cmds:
      - '{{.PYTHON}} {{.RUNNER}} local-down'
