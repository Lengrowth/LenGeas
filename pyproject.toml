[project]
name = "lengeas-platform"
version = "0.1.0"
description = "LenGeas platform engineering foundation"
requires-python = "==3.13.5"
dependencies = [
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "pyjwt==2.14.0",
    "pymongo==4.14.1",
    "starlette==1.6.0",
    "uvicorn==0.35.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "hypothesis==6.140.3",
  "jsonschema==4.25.1",
  "ruff==0.13.1",
  "mypy==1.18.2",
  "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: pure deterministic tests",
  "property: invariant and generated-input tests",
  "contract: public contract tests",
  "integration: real local dependency tests",
  "e2e: production-like workflow tests",
  "security: negative security tests",
  "performance: bounded performance tests",
  "determinism: repeatability tests",
  "disaster_recovery: recovery rehearsal tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["apps", "packages", "tools"]
